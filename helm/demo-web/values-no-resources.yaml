replicaCount: 1

image:
  repository: fevoll/dataops-topic13
  tag: "1.0.0"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: example.com
      paths:
        - path: /
          pathType: Prefix

resources:
  enabled: false

sharedMemory:
  enabled: true
  sizeLimit: "128Mi"
