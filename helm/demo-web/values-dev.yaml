replicaCount: 1

image:
  repository: fevoll/dataops-topic13
  tag: "1.0.0"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: dev.example.com
      paths:
        - path: /
          pathType: Prefix

resources:
  enabled: true
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "128Mi"
    cpu: "200m"

sharedMemory:
  enabled: true
  sizeLimit: "64Mi"
